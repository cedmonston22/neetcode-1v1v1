<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NeetCode 1v1v1 room</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="room">
      <header class="track">
        <div id="clock" class="clock" aria-live="off">10:00</div>
        <div id="lanes" class="lanes" aria-label="Race progress"></div>
        <div class="room-code">Room<strong id="room-code"></strong></div>
      </header>

      <section id="lobby" class="lobby hidden">
        <div class="lobby-inner">
          <div>
            <h2>Send this link to your roommates</h2>
            <div class="share">
              <input id="share-link" type="text" readonly aria-label="Room link" />
              <button id="copy-link">Copy link</button>
            </div>
          </div>

          <div>
            <h2>Players</h2>
            <ul id="roster" class="roster"></ul>
          </div>

          <div>
            <h2>Topics</h2>
            <div id="topic-chips" class="chips"></div>
          </div>

          <div>
            <h2>Difficulty</h2>
            <div id="difficulty-chips" class="chips"></div>
          </div>

          <div>
            <h2>Match length</h2>
            <div id="minute-chips" class="chips" role="radiogroup" aria-label="Match length in minutes"></div>
          </div>

          <div class="ready-row">
            <button id="ready" class="go">I'm ready</button>
            <span id="ready-hint" class="soft"></span>
          </div>
        </div>
      </section>

      <section id="arena" class="arena hidden">
        <article class="problem">
          <h1 id="problem-title"></h1>
          <div class="problem-meta">
            <span id="problem-difficulty"></span>
            <span id="problem-topic" class="soft"></span>
          </div>
          <div id="problem-body" class="problem-body"></div>
        </article>

        <div class="workbench">
          <div id="my-editor" class="editor-host"></div>
          <div class="controls">
            <button id="run">Run examples</button>
            <button id="submit" class="go">Submit</button>
            <span class="hint">Ctrl+Enter runs, Ctrl+Shift+Enter submits</span>
          </div>
          <div id="console" class="console" aria-live="polite">
            <p class="soft">Run your code against the examples, or submit it against every test.</p>
          </div>
        </div>
      </section>

      <section id="results" class="results hidden">
        <div class="results-inner">
          <div class="results-head">
            <div>
              <h2 id="results-title"></h2>
              <p id="results-sub" class="soft"></p>
            </div>
            <button id="back-to-lobby" class="primary">Back to lobby</button>
          </div>
          <div id="solutions" class="solutions"></div>
        </div>
      </section>
    </div>

    <div id="countdown" class="overlay hidden" aria-live="assertive">
      <div id="countdown-number" class="countdown-number"></div>
    </div>

    <div id="name-dialog" class="overlay hidden">
      <form id="name-form" class="dialog">
        <h2>Who's playing?</h2>
        <div class="field">
          <label for="name-input">Your name</label>
          <input id="name-input" type="text" maxlength="20" autocomplete="nickname" required />
        </div>
        <button type="submit" class="primary">Join room</button>
      </form>
    </div>

    <div id="fatal" class="overlay hidden">
      <div class="dialog">
        <h2>Can't join this room</h2>
        <p id="fatal-message"></p>
        <a href="/"><button class="primary">Go to the home page</button></a>
      </div>
    </div>

    <div id="toast" class="toast hidden" role="status"></div>

    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
